
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Pedidos</title>
    <link rel="stylesheet" href="../style/style.css">
    <script src="../script/script.js" defer></script>
</head>
<body data-page="pedidos">

<header>
    <h2>Padaria.sys</h2>
    <nav>
        <a href="../index.html">Início</a>
        <a href="clientes.html">Clientes</a>
        <a href="produtos.html">Produtos</a>
        <a href="funcionarios.html">Funcionários</a>
        <a href="pedidos.html">Pedidos</a>
    </nav>
</header>

<main class="container">
    <h1>Registro de Pedidos</h1>

    <section class="painel">
        <form id="formPedido">

            <label>Cliente:
                <select name="id_cliente" id="pedidoCliente" required>
                    <option value="">Selecione um cliente</option>
                </select>
            </label>

            <label>Funcionário:
                <select name="id_funcionario" id="pedidoFuncionario" required>
                    <option value="">Selecione um funcionário</option>
                </select>
            </label>

            <label>Produto:
                <select name="id_produto" id="pedidoProduto" required>
                    <option value="">Selecione um produto</option>
                </select>
            </label>

            <label>Quantidade:
                <input type="number" name="quantidade" min="1" value="1" required>
            </label>

            <button type="submit">Registrar pedido</button>
        </form>

        <p id="mensagemPedido"></p>
    </section>

    <section class="painel">
        <h2>Pedidos registrados</h2>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Cliente</th>
                    <th>Funcionário</th>
                    <th>Status</th>
                    <th>Total</th>
                </tr>
            </thead>
            <tbody id="listaPedidos"></tbody>
        </table>
    </section>
</main>

<footer>Projeto Integrado - 2026</footer>

</body>
</html>
